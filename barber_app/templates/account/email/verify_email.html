<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2 style="color: #333;">Barber App</h2>
        <p>Hi {{ email }},</p>
        <p>To verify your email address, please use the following code:</p>
        <h3 style="color: #4CAF50; letter-spacing: 2px;">{{ verification_code }}</h3>
        <p>If you didn't request this, you can safely ignore this email.</p>
        <p>Teşekkürler<br></p>
    </div>
</body>
</html>
